[package]
name = "sleuth"
version = "0.1.0"
edition = "2024"
description = "Diagnose CI/CD failures faster"

[[bin]]
name = "sleuth"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
octocrab = "0.51.0"
reqwest = "0.13.4"
rustls = "0.23.40"
